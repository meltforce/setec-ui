# A release tag produces the installable DMG.
#
# This is the one workflow that runs on GitHub. The repository here is a push
# mirror of `meltforce.net/setec-ui` on Forgejo (homelab STANDARDS.md § *Git &
# repos*), so this file is edited there and arrives with the next sync; a commit
# made on GitHub is deleted by the mirror's next `git push --mirror`. Nothing
# in this workflow writes back to the repository for that reason — GitHub
# Releases are not git refs and survive the sync.
#
# It runs on GitHub rather than on the Forgejo runner because the fleet has no
# macOS runner and a seat Mac is not one.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds and signs without publishing anything, so the pipeline can be
  # exercised before a tag is cut. The DMG is left as a run artifact.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (YYYY.MM.DD). Empty means today. Publishes no release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION:-$(date +%Y.%m.%d)}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Select the newest Xcode and check its SDK
        run: |
          XCODE=$(/bin/ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          TARGET=$(sed -n 's/^ *macOS: *"\(.*\)"/\1/p' project.yml | head -1)
          echo "macOS SDK $SDK, deployment target $TARGET"
          # A deployment target above the installed SDK fails several hundred
          # lines into the build with a message about the scheme rather than
          # about the SDK. The runner image decides which Xcode is newest, and
          # project.yml is raised on a seat Mac whose Xcode may be ahead of it.
          if [ "$(printf '%s\n%s\n' "$SDK" "$TARGET" | sort -V | head -1)" != "$TARGET" ]; then
            echo "::error::project.yml targets macOS $TARGET; the runner's newest SDK is $SDK"
            exit 1
          fi

      - name: Install the build tools
        run: brew install --quiet xcodegen create-dmg

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # codesign reads the search list, not the keychain file, so the
          # temporary keychain is put on it next to the runner's default one.
          security list-keychains -d user -s "$KEYCHAIN" \
            "$(security default-keychain -d user | tr -d '" ' )"
          # Without this, codesign waits for a UI prompt that no one answers and
          # the job ends at the timeout rather than with an error.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize and package
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: scripts/package.sh --version "${{ steps.version.outputs.version }}" --notarize

      - name: Record the checksum
        id: dmg
        run: |
          DMG=".build/Setec-UI-${{ steps.version.outputs.version }}.dmg"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Keep the DMG as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: Setec-UI-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.path }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          # The notes go to a file rather than through `--notes "$(cat <<…)"`:
          # bash 3.2, which is what /bin/bash is on the runner, mis-parses a
          # heredoc inside a command substitution and stops at the first
          # apostrophe in the text ("Tailscale's" — measured 2026-09-21).
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          A native macOS client for [setec](https://github.com/tailscale/setec),
          Tailscale's secrets service: find a secret, reveal and copy its value,
          publish a new version, roll back by activating an older one, delete a
          version or a whole secret, and see which tailnet principals hold which
          grant.

          ### Install

          \`\`\`
          brew tap meltforce/tap
          brew install --cask setec-ui
          \`\`\`

          Or open \`Setec-UI-$VERSION.dmg\` below and drag **Setec UI** to
          Applications.
          The app and the disk image are signed by Linus Schmelzer under Apple
          Developer ID team R43S29F4G5 and notarized by Apple, so it opens
          without a Gatekeeper override.

          ### What it needs

          - macOS 26.2 or newer, Apple silicon or Intel — the app is universal.
          - A setec server reachable over your tailnet. **The app ships with no
            server built in**: name one in Settings (⌘,) or start it with
            \`SETEC_SERVER\` set. Until then the list reads "No server yet".
          - Tailscale signed in on the Mac. setec authorizes by the tailnet
            identity of the connection, so there is no login screen and no token
            to enter. The \`tailscale\` CLI is read once per launch for the name
            the toolbar shows; without it the toolbar says "Identity unknown"
            and nothing else changes.

          ### Verify the download

          The checksum says it is the file this pipeline built; the assessment
          says what Gatekeeper will answer and who signed it.

          \`\`\`
          shasum -a 256 Setec-UI-$VERSION.dmg
          # $SHA256

          spctl --assess --type open --context context:primary-signature -vv Setec-UI-$VERSION.dmg
          # accepted
          # source=Notarized Developer ID
          # origin=Developer ID Application: Linus Schmelzer (R43S29F4G5)
          \`\`\`

          [Commits in this release](https://github.com/meltforce/setec-ui/commits/$GITHUB_REF_NAME)
          NOTES

          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "Setec UI $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # The tap is written by CI and is therefore GitHub-canonical, unlike this
      # repository, which is a mirror. GITHUB_TOKEN cannot reach another
      # repository, so the write uses a PAT.
      - name: Update the Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAP=meltforce/homebrew-tap
          CASK=Casks/setec-ui.rb

          RESPONSE=$(gh api "repos/$TAP/contents/$CASK")
          FILE_SHA=$(jq -r .sha <<<"$RESPONSE")
          jq -r .content <<<"$RESPONSE" | base64 --decode > cask.rb

          # Only these two lines move. The download URL is built from the
          # version inside the cask, so it follows without being touched.
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            cask.rb
          grep -E '^  (version|sha256) ' cask.rb

          if ! git diff --no-index --quiet <(jq -r .content <<<"$RESPONSE" | base64 --decode) cask.rb; then
            gh api "repos/$TAP/contents/$CASK" -X PUT \
              -f message="setec-ui $VERSION" \
              -f sha="$FILE_SHA" \
              -f content="$(base64 -i cask.rb | tr -d '\n')" \
              --jq '.commit.html_url'
          else
            echo "cask already names $VERSION with this checksum"
          fi

          # A cask that names a version whose download does not exist is worse
          # than no cask, so the result is read back and the URL is fetched.
          sleep 2
          gh api "repos/$TAP/contents/$CASK" --jq .content | base64 --decode | grep -q "version \"$VERSION\"" \
            || { echo "::error::the cask does not name $VERSION after the write"; exit 1; }
          curl -sSfLI -o /dev/null "https://github.com/meltforce/setec-ui/releases/download/$GITHUB_REF_NAME/Setec-UI-$VERSION.dmg" \
            && echo "the URL the cask builds resolves"

      - name: Summary
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| DMG | \`$(basename "${{ steps.dmg.outputs.path }}")\` |"
            echo "| SHA-256 | \`${{ steps.dmg.outputs.sha256 }}\` |"
            echo "| Released | ${{ startsWith(github.ref, 'refs/tags/v') }} |"
          } >> "$GITHUB_STEP_SUMMARY"
